name: Godot 3D Prototype Check

on:
  push:
    branches: [rebuild-3d]
    paths:
      - "prototype3d/**"
      - ".github/workflows/godot-3d-check.yml"
  pull_request:
    paths:
      - "prototype3d/**"
      - ".github/workflows/godot-3d-check.yml"
  workflow_dispatch:

jobs:
  validate-3d:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Import and parse the 3D project
        run: godot --headless --editor --path prototype3d --quit

      - name: Run the 3D scene for 120 frames
        run: godot --headless --path prototype3d --quit-after 120
