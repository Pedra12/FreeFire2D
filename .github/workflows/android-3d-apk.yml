name: FreeFire 3D Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "prototype3d/**"
      - ".github/workflows/android-3d-apk.yml"
  push:
    branches: [rebuild-3d]
    paths:
      - "prototype3d/**"
      - ".github/workflows/android-3d-apk.yml"

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CC0 3D asset pack
        run: bash .github/scripts/download-kenney-assets.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: sdkmanager --install "build-tools;34.0.0" "platforms;android-34" "ndk;23.2.8568313" "cmake;3.10.2.4988404"

      - name: Install Godot 4.3 and Android export templates
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android paths and debug signing
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import and validate 3D project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path prototype3d --quit 2>&1 | tee /tmp/godot-android-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" /tmp/godot-android-import.log; then
            exit 1
          fi

      - name: Export Android APK
        run: |
          mkdir -p prototype3d/build
          godot --headless --path prototype3d --export-debug "Android" build/FreeFire3D.apk 2>&1 | tee /tmp/godot-android-export.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:" /tmp/godot-android-export.log; then
            exit 1
          fi
          test -s prototype3d/build/FreeFire3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeFire3D-Android-APK
          path: prototype3d/build/FreeFire3D.apk
          if-no-files-found: error
          retention-days: 14
