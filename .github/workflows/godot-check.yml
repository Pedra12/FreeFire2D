name: Godot project check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Import root project
        run: godot --headless --editor --path . --quit

      - name: Import and parse 3D project
        run: godot --headless --editor --path prototype3d --quit

      - name: Run 3D scene for 120 frames
        run: godot --headless --path prototype3d --quit-after 120
