name: Godot project check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CC0 3D asset pack
        run: bash .github/scripts/download-kenney-assets.sh

      - name: Install Godot 4
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Import root project
        run: godot --headless --editor --path . --quit

      - name: Import and parse 3D project
        run: godot --headless --editor --path prototype3d --quit

      - name: Install virtual display for 3D runtime test
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Run 3D scene for 120 frames
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a godot --path prototype3d --rendering-method gl_compatibility --audio-driver Dummy --quit-after 120 2>&1 | tee /tmp/godot-3d-run.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:" /tmp/godot-3d-run.log; then
            exit 1
          fi
