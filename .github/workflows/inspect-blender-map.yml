name: Inspect and convert Blender map
on:
  push:
    branches: [rebuild-3d]
    paths:
      - 'free-fire-ful-map.zip'
      - '.github/workflows/inspect-blender-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Blender and unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y blender unzip python3-numpy

      - name: Extract and inspect map archive
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/map_source output
          unzip -q free-fire-ful-map.zip -d /tmp/map_source
          echo "## Conteúdo do ZIP" > output/inspection.txt
          find /tmp/map_source -type f -printf '%P (%s bytes)\n' | sort | tee -a output/inspection.txt
          BLEND_FILE="$(find /tmp/map_source -type f -iname '*.blend' -print -quit)"
          if [ -z "$BLEND_FILE" ]; then
            echo "RESULT=NO_BLEND" >> "$GITHUB_OUTPUT"
            echo "\nERRO: nenhum arquivo .blend encontrado no ZIP." | tee -a output/inspection.txt
            exit 1
          fi
          echo "BLEND_FILE=$BLEND_FILE" >> "$GITHUB_OUTPUT"
          echo "RESULT=FOUND" >> "$GITHUB_OUTPUT"
          echo "\nArquivo Blender encontrado: $BLEND_FILE" | tee -a output/inspection.txt
          echo "\nArquivos auxiliares (texturas/modelos):" | tee -a output/inspection.txt
          find /tmp/map_source -type f ! -iname '*.blend' -printf '%P (%s bytes)\n' | sort | tee -a output/inspection.txt

      - name: Convert Blender scene to GLB
        if: steps.inspect.outputs.RESULT == 'FOUND'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/export_map.py <<'PY'
          import bpy, os, sys
          source = os.environ["BLEND_FILE"]
          target = os.path.abspath("output/free-fire-map.glb")
          print("BLENDER_PYTHON:", sys.version)
          print("PYTHON_PATH:", sys.path)
          import numpy
          print("NUMPY_VERSION:", numpy.__version__)
          bpy.ops.wm.open_mainfile(filepath=source)
          # Replace missing external images with generated, packed fallback textures.
          missing = []
          for image in list(bpy.data.images):
              if image.source == 'FILE':
                  path = bpy.path.abspath(image.filepath)
                  if not os.path.exists(path) and not image.packed_file:
                      missing.append((image, image.filepath))
          import numpy as np
          generated = []
          size = 512
          yy, xx = np.mgrid[0:size, 0:size]
          for old_image, old_path in missing:
              rng = np.random.default_rng(42 if 'Building' in old_image.name else 84)
              noise = rng.normal(0.0, 0.035, (size, size))
              if 'Building' in old_image.name:
                  # Warm concrete facade with subtle repeated window panels.
                  windows = ((xx % 96 > 22) & (xx % 96 < 72) & (yy % 128 > 28) & (yy % 128 < 96))
                  pixels = np.zeros((size, size, 4), dtype=np.float32)
                  base = 0.48 + noise
                  pixels[..., 0] = np.where(windows, 0.12 + noise, base)
                  pixels[..., 1] = np.where(windows, 0.16 + noise, base * 0.92)
                  pixels[..., 2] = np.where(windows, 0.18 + noise, base * 0.80)
              else:
                  # Natural grass/earth top-view texture with soft color variation.
                  patch = (np.sin(xx / 37.0) + np.cos(yy / 53.0) + np.sin((xx + yy) / 71.0)) / 6.0
                  pixels = np.zeros((size, size, 4), dtype=np.float32)
                  pixels[..., 0] = np.clip(0.20 + patch + noise, 0.05, 0.55)
                  pixels[..., 1] = np.clip(0.34 + patch * 1.4 + noise, 0.10, 0.70)
                  pixels[..., 2] = np.clip(0.13 + patch * 0.55 + noise, 0.04, 0.40)
              pixels[..., 3] = 1.0
              replacement = bpy.data.images.new(old_image.name + '_generated', width=size, height=size, alpha=True)
              replacement.pixels.foreach_set(pixels.reshape(-1))
              replacement.filepath_raw = os.path.abspath('output/' + replacement.name + '.png')
              replacement.file_format = 'PNG'
              replacement.save()
              replacement.pack()
              for material in bpy.data.materials:
                  if material.use_nodes and material.node_tree:
                      for node in material.node_tree.nodes:
                          if node.type == 'TEX_IMAGE' and node.image == old_image:
                              node.image = replacement
              generated.append(replacement.name)
          with open("output/missing-textures.txt", "w") as report:
              for image, path in missing:
                  report.write(f"Replaced missing texture {image.name} ({path}) with generated fallback\n")
              report.write("Generated textures: " + ", ".join(generated) + "\n")
          print("MISSING_TEXTURES_REPLACED:", [x[0].name for x in missing])
          try:
              bpy.ops.file.pack_all()
          except Exception as exc:
              print("PACK_WARNING:", exc)
          print("SCENE_OBJECTS:", len(bpy.data.objects))
          for obj in bpy.data.objects:
              print("OBJECT:", obj.name, obj.type)
          result = bpy.ops.export_scene.gltf(filepath=target, export_format='GLB', export_apply=True)
          print("EXPORT_RESULT:", result)
          if 'FINISHED' not in result or not os.path.isfile(target) or os.path.getsize(target) < 1024:
              raise RuntimeError("GLB export did not produce a valid output file")
          print("EXPORTED:", target, os.path.getsize(target))
          PY
          BLEND_FILE="${{ steps.inspect.outputs.BLEND_FILE }}" blender -b --python /tmp/export_map.py 2>&1 | tee output/blender-conversion.log
          test -s output/free-fire-map.glb
          ls -lh output/free-fire-map.glb | tee -a output/inspection.txt
          mkdir -p prototype3d/assets/maps
          cp output/free-fire-map.glb prototype3d/assets/maps/free-fire-complete-map.glb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype3d/assets/maps/free-fire-complete-map.glb
          if ! git diff --cached --quiet; then
            git commit -m "Add converted complete Free Fire map"
            git push
          fi

      - name: Upload inspection and converted map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-fire-map-inspection
          path: output/
          if-no-files-found: warn
          retention-days: 14
